  defaults:
    _legacy_controller: AdminInpostStatus

inpost_status_report:
  path: /admin/inpost/status/report
  controller: Inpost\VonHalsky\Controller\Admin\StatusController::reportAction
  methods: [GET]
  defaults:
    _legacy_controller: AdminInpostStatus

inpost_jobs:
  path: /admin/inpost/jobs
  controller: Inpost\VonHalsky\Controller\Admin\JobsController::indexAction
