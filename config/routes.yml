# ====================
# Offer Routes
# ====================
inpost_offers_list:
  path: /admin/inpost/offers
  controller: Inpost\VonHalsky\Controller\Admin\OfferController::listAction
  methods: [GET]
  defaults:
    _legacy_controller: AdminInpostOffers

inpost_offers_create:
  path: /admin/inpost/offers/create
  controller: Inpost\VonHalsky\Controller\Admin\OfferController::createAction
  methods: [GET, POST]

inpost_offers_edit:
  path: /admin/inpost/offers/{id}/edit
  controller: Inpost\VonHalsky\Controller\Admin\OfferController::editAction
  methods: [GET, POST]
  requirements:
    id: '\d+'

inpost_offers_delete:
  path: /admin/inpost/offers/{id}/delete
  controller: Inpost\VonHalsky\Controller\Admin\OfferController::deleteAction
  methods: [POST, DELETE]
  requirements:
    id: '\d+'

inpost_offers_create_combinations:
  path: /admin/inpost/offers/create/{productId}/combinations
  controller: Inpost\VonHalsky\Controller\Admin\OfferController::createCombinationsAction
  methods: [POST]
  requirements:
    productId: '\d+'

inpost_offers_publish_combinations:
  path: /admin/inpost/offers/create/{productId}/combinations/publish
  controller: Inpost\VonHalsky\Controller\Admin\OfferController::publishCombinationsAction
  methods: [POST]
  requirements:
    productId: '\d+'

inpost_offers_bulk_delete:
  path: /admin/inpost/offers/bulk/delete
  controller: Inpost\VonHalsky\Controller\Admin\OfferController::bulkDeleteAction
  methods: [POST]

inpost_offers_bulk_close:
  path: /admin/inpost/offers/bulk/close
  controller: Inpost\VonHalsky\Controller\Admin\OfferController::bulkCloseAction
  methods: [POST]

inpost_offers_bulk_reopen:
  path: /admin/inpost/offers/bulk/reopen
  controller: Inpost\VonHalsky\Controller\Admin\OfferController::bulkReopenAction
  methods: [POST]

inpost_offers_send:
  path: /admin/inpost/offers/{id}/send
  controller: Inpost\VonHalsky\Controller\Admin\OfferController::sendAction
  methods: [POST]
  requirements:
    id: '\d+'

